# Alertas do Grafana (unified alerting) provisionados como código.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: administradores
    receivers:
      - uid: email-administradores
        type: email
        settings:
          addresses: ${EMAIL_ADMINS}
          singleEmail: true

policies:
  - orgId: 1
    receiver: administradores
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: feedback-funcoes
    folder: Feedback de Aulas
    interval: 1m
    rules:
      - uid: taxa-erro-funcoes
        title: Taxa de erro das funções > 0
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severidade: alta }
        annotations:
          summary: "Função respondendo 5xx: {{ $values.A }} req/s com erro (5 min)"
          description: Verifique o painel "Taxa de erro" e os logs de erro (Loki) pelo correlationId.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum(rate(gateway_function_invocation_total{code=~"5.."}[5m])) or vector(0)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: logs-erro-funcoes
        title: Logs de erro nas funções
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severidade: alta }
        annotations:
          summary: "{{ $values.A }} log(s) nivel=ERROR nos últimos 5 min (ex.: evento_nao_publicado)"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: sum(count_over_time({job="faasd", nivel="ERROR"}[5m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: pico-avaliacoes-criticas
        title: Pico de avaliações CRÍTICA
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severidade: media }
        annotations:
          summary: "{{ $values.A }} avaliações CRÍTICA em 15 min (limite: 5)"
          description: Volume anormal de avaliações críticas; pode indicar problema em uma aula ou turma.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: sum(count_over_time({funcao="receber-avaliacao"} | json | evento="avaliacao_registrada" | urgencia="CRITICA" [15m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [5] }
